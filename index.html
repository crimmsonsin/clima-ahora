<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consulta el clima actual y el pronóstico de tu ciudad." />
    <title>Clima Ahora | Weather app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Clima Ahora, inicio">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>clima<span class="brand-accent">.</span>ahora</span>
        </a>
        <span class="live-pill"><span class="live-dot"></span> Datos en vivo</span>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Tu pronóstico, simplificado</p>
        <h1 id="page-title">¿Cómo está el clima?</h1>
        <form class="search-form" id="search-form">
          <label class="sr-only" for="city-input">Busca una ciudad</label>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="city-input" name="city" type="search" placeholder="Busca una ciudad..." autocomplete="off" required />
          <button type="submit">Buscar</button>
        </form>
        <p class="status-message" id="status-message" role="status"></p>
      </section>

      <section class="weather-dashboard is-loading" id="weather-dashboard" aria-live="polite" aria-busy="true" aria-label="Información meteorológica">
        <div class="current-weather">
          <div>
            <p class="location-label">Ubicación actual</p>
            <h2 id="location-name">Cargando...</h2>
            <p class="date-label" id="date-label">--</p>
          </div>
          <div class="temperature">
            <span id="weather-icon" class="weather-icon" aria-hidden="true">☀</span>
            <strong><span id="temperature">--</span><sup>°</sup></strong>
            <p id="weather-description">--</p>
          </div>
        </div>

        <div class="metrics" aria-label="Métricas actuales">
          <article class="metric"><span class="metric-icon">♨</span><div><small>Sensación</small><strong><span id="feels-like">--</span>°</strong></div></article>
          <article class="metric"><span class="metric-icon">◒</span><div><small>Humedad</small><strong><span id="humidity">--</span>%</strong></div></article>
          <article class="metric"><span class="metric-icon">≋</span><div><small>Viento</small><strong><span id="wind-speed">--</span> km/h</strong></div></article>
          <article class="metric"><span class="metric-icon">◌</span><div><small>Visibilidad</small><strong><span id="visibility">--</span> km</strong></div></article>
        </div>

        <div class="forecast-heading">
          <h3>Pronóstico de 5 días</h3>
          <span id="unit-label">°C</span>
        </div>
        <div class="forecast-list" id="forecast-list"></div>
      </section>

      <footer>Datos meteorológicos proporcionados por <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></footer>
    </main>
  </body>
</html>
